apiVersion: v1
kind: Service
metadata: {name: api-svc, namespace: binome1}
spec:
  type: ClusterIP
  selector: {app: api, tier: backend}
  ports:
  - port: 80
    targetPort: 9898
---
apiVersion: v1
kind: Service
metadata: {name: frontend-svc, namespace: binome1}
spec:
  type: ClusterIP
  selector: {app: frontend, tier: frontend}
  ports:
  - port: 80
    targetPort: 80
