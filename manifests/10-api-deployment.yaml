apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: binome1
  labels: {app: api, tier: backend}
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: api, tier: backend}
  template:
    metadata:
      labels: {app: api, tier: backend}
    spec:
      containers:
      - name: podinfo
        image: ghcr.io/stefanprodan/podinfo:6.7.0
        ports:
        - containerPort: 9898
        readinessProbe:
          httpGet: {path: /readyz, port: 9898}
          initialDelaySeconds: 2
          periodSeconds: 3
