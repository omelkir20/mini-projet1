apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: binome1
  labels: {app: frontend, tier: frontend}
spec:
  replicas: 2
  selector:
    matchLabels: {app: frontend, tier: frontend}
  template:
    metadata:
      labels: {app: frontend, tier: frontend}
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
